[package]
name = "glassgram"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Telegram client with a liquid glass UI"
build = "build.rs"

[dependencies]
arboard = "3.7"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "6"
eframe = "0.37.0"
grammers-client = { version = "0.11", features = ["proxy"] }
grammers-session = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = "0.2"
# SVG path parsing for the Lucide icons; already pulled in by the renderer, pure Rust.
kurbo = "0.13"
# Reads the Lucide SVG files in assets/icons; already in the build, pure Rust.
roxmltree = "0.21"
# The same SQLite that grammers uses for the session: no new system libraries needed.
libsql = { version = "0.10", default-features = false, features = ["core"] }
open = "5"
qrcode = { version = "0.14", default-features = false }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
tokio = { version = "1.54.0", features = ["full"] }

# Desktop notifications: D-Bus via zbus on Linux (pure Rust), WinRT toasts on Windows, Notification Center on macOS.
notify-rust = { version = "4.11", default-features = false, features = ["z"] }

# Mini app windows (webview.rs): the system WebView — WebView2 on Windows, WKWebView on macOS,
# WebKitGTK on Linux. The one exception to "no system dev libraries": Linux builds need
# libwebkit2gtk-4.1-dev; the Flatpak gets it from the GNOME runtime.
wry = "0.57"
tao = "0.37"

# Tray: StatusNotifierItem over D-Bus on Linux, without GTK or other system libraries.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

# Tray on Windows and macOS (on Linux it would need GTK, so ksni is used there).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.21", default-features = false }

# Hiding the window to the tray and bringing it back (its HWND).
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# The exe icon on Windows (MSVC resource compiler); pure Rust, does nothing elsewhere.
winresource = "0.1"
