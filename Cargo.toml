[package]
name = "glassgram"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Telegram client with a liquid glass UI"

[dependencies]
arboard = "3.7"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "6"
eframe = "0.37.0"
grammers-client = { version = "0.11", features = ["proxy"] }
grammers-session = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = "0.2"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
open = "5"
qrcode = { version = "0.14", default-features = false }
rfd = "0.17"
sha2 = "0.10"
sys-locale = "0.3"
tokio = { version = "1.54.0", features = ["full"] }
