# Release builds: Windows installer and Flatpak bundle with the Telegram API keys built in.
# The keys come from the repository secrets TG_API_ID / TG_API_HASH (Settings → Secrets → Actions)
# and only reach the build as GLASSGRAM_API_ID / GLASSGRAM_API_HASH (see build.rs).
# Only a pushed tag or a manual run starts this, never a pull request, so forks can't read the secrets;
# nothing that holds the keys is cached.
#
# Windows code signing (SignPath Foundation) runs once the SIGNPATH_API_TOKEN secret and the
# SIGNPATH_ORGANIZATION_ID variable are set; until then the release is built unsigned. Each signing
# request waits for a manual approval in SignPath. Artifact configurations: packaging/windows/signpath.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # SignPath reads the workflow run and the uploaded artifacts.
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          "GLASSGRAM_VERSION=$v" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          GLASSGRAM_API_ID: ${{ secrets.TG_API_ID }}
          GLASSGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
        run: cargo build --release --locked --features no-key-screen

      # The exe is signed before packaging, so the installed program carries the signature too.
      - name: Upload unsigned exe
        id: unsigned-exe
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          path: target/release/glassgram.exe
          archive: false

      - name: Sign exe
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: glassgram
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          # Time for the manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe
          parameters: |
            version: "${{ env.GLASSGRAM_VERSION }}"

      - name: Use signed exe
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item (Get-ChildItem signed-exe -Filter *.exe | Select-Object -First 1).FullName target/release/glassgram.exe -Force

      # GPL build with libx264, libopus, libvpx and ffplay; it goes next to glassgram.exe.
      # BtbN renames the archives with every ffmpeg release, so take the newest stable one from the list.
      - name: ffmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '[.assets[].name | select(test("^ffmpeg-n[0-9.]+-latest-win64-gpl-[0-9.]+\\.zip$"))] | sort_by(capture("-n(?<v>[0-9.]+)-").v | split(".") | map(tonumber)) | last'
          if (-not $asset) { throw "No ffmpeg win64 gpl archive in BtbN/FFmpeg-Builds latest" }
          Write-Host "ffmpeg: $asset"
          gh release download latest -R BtbN/FFmpeg-Builds --pattern $asset --output ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-zip
          New-Item -ItemType Directory -Force dist/ffmpeg | Out-Null
          $root = Get-ChildItem ffmpeg-zip | Select-Object -First 1
          Copy-Item "$($root.FullName)/bin/ffmpeg.exe", "$($root.FullName)/bin/ffplay.exe", "$($root.FullName)/LICENSE.txt" dist/ffmpeg/

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\glassgram.iss

      - name: Upload unsigned installer
        id: unsigned-installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          path: dist/Glassgram-${{ env.GLASSGRAM_VERSION }}-setup.exe
          archive: false

      - name: Sign installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: glassgram
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
          parameters: |
            version: "${{ env.GLASSGRAM_VERSION }}"

      - name: Use signed installer
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item (Get-ChildItem signed-installer -Filter *.exe | Select-Object -First 1).FullName "dist/Glassgram-$env:GLASSGRAM_VERSION-setup.exe" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      # The manifest's dir source picks this file up; the build deletes it after compiling.
      - name: Keys
        env:
          GLASSGRAM_API_ID: ${{ secrets.TG_API_ID }}
          GLASSGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
        run: printf 'GLASSGRAM_API_ID=%s\nGLASSGRAM_API_HASH=%s\n' "$GLASSGRAM_API_ID" "$GLASSGRAM_API_HASH" > keys.env

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: Glassgram.flatpak
          manifest-path: packaging/flatpak/io.github.petro_pixel.Glassgram.yml
          # The build directories would contain keys.env and the binary.
          cache: false

  release:
    needs: [windows, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Only the finished files: the unsigned copies sent to SignPath are artifacts of this run too.
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: '*flatpak*'
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
